<style>
#titulo {
   font-family: 'Open Sans', sans-serif !important;
  font-size: clamp(1.4rem, 3vw, 2.2rem) !important;
  font-weight: 700 !important;
  color: #a22221 !important;
  letter-spacing: 1px !important;
  text-transform: uppercase !important;
  margin: 0 0 28px 0 !important;
  text-align: center;
}

/* ── Envoltorio: extiende el fondo a todo el ancho de la pantalla ── */
.cifras-seccion {
  background-color: #ffffff;
  width: 100vw;
  position: relative;
  left: 50%;
  right: 50%;
  margin-left: -50vw;
  margin-right: -50vw;
  margin-top: -110px; /* absorbe el padding-bottom:110px del bloque anterior */
}

/* ── Contenedor principal (grid responsivo) ── */
.cifras-contenedor {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px;
  padding: 15px 20px 20px 20px;
  max-width: 1200px;
  margin: 0 auto;
  font-family: inherit;
}

/* ── Tarjeta base ── */
.cifras-tarjeta {
  position: relative;
  background-color: #F2ECEC;
  border-radius: 18px;
  overflow: visible;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.10);
  display: flex;
  flex-direction: column;
  text-align: center;
  margin-top: 34px;
  transition: box-shadow 0.35s ease;
}

/* ── Hover: brillo dorado POR FUERA de la tarjeta ── */
.cifras-tarjeta:hover {
  box-shadow:
    0 0 0 3px rgba(232, 194, 80, 0.55),
    0 10px 28px rgba(152, 106, 0, 0.45);
}

/* ── Header guinda (rectangular, sólido) ── */
.cifras-seccion .cifras-header {
  position: relative;
  z-index: 3;
  background: transparent;
  color: #ffffff;
  padding: 46px 20px 30px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
/* Fondo guinda real: un SVG que dibuja el rectángulo + la curva de
   sonrisa como UNA sola forma continua, garantizando que el guinda
   nunca sobrepase el dorado (ambos vienen del mismo trazo). */
.cifras-header-fondo {
  position: absolute;
  inset: 0;
  bottom: -30px;
  width: 100%;
  height: calc(100% + 30px);
  z-index: -1;
  border-radius: 18px 18px 0 0;
  overflow: hidden;
}
.cifras-header-fondo path {
  fill: #7D212C;
}
.cifras-header-fondo .cifras-header-borde {
  fill: none;
  stroke: url(#cifras-degradado-dorado);
  stroke-width: 5;
}

/* ── Aro circular con degradado dorado — completo, sin recorte ── */
.cifras-icono-aro {
  position: absolute;
  top: -34px;
  left: 50%;
  transform: translateX(-50%);
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: linear-gradient(135deg, #986A00 0%, #EEE2BB 100%);
  padding: 4px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  z-index: 5;
}
.cifras-icono-aro::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: #ffffff;
}
.cifras-icono-img {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 12px;
  box-sizing: border-box;
}

/* ── Número grande dentro del header ── */
.cifras-seccion .cifras-numero {
  font-size: clamp(1.8rem, 3vw, 2.4rem);
  font-weight: 800;
  line-height: 1.1;
  margin-top: 18px;
}

/* ── Cuerpo claro de la tarjeta ── */
.cifras-cuerpo {
  position: relative;
  z-index: 3;
  padding: 22px 20px 40px 20px;
  min-height: 190px;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  overflow: hidden;
  border-radius: 0 0 18px 18px;
  background-color: #F2ECEC;
}
.cifras-seccion .cifras-cuerpo h3 {
  position: relative !important;
  z-index: 2 !important;
  color: #7D212C !important;
  font-size: 1.1rem !important;
  line-height: 1.3 !important;
  margin: 0 0 10px 0 !important;
  padding: 0 !important;
  font-weight: 700 !important;
}
.cifras-seccion .cifras-cuerpo p {
  position: relative !important;
  z-index: 2 !important;
  color: #6c584c !important;
  font-size: 0.92rem !important;
  line-height: 1.45 !important;
  margin: 0 !important;
  padding: 0 !important;
  font-weight: 400 !important;
}

/* ── Triángulos: lados EXTERIORES rectos, solo la diagonal
   central es curva y se hunde hacia el centro (cóncava) ── */
.cifras-onda {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 60%;
  z-index: 1;
}
.cifras-onda-izq {
  fill: url(#cifras-degradado-izq);
  stroke: #7D6221;
  stroke-width: 1.5;
}
.cifras-onda-der {
  fill: url(#cifras-degradado-der);
  stroke: #7D6221;
  stroke-width: 1.5;
}
#cifras-institucionales {
    scroll-margin-top: 100px; /* ajusta según la altura real de tu menú fijo */
}

/* ══════════════════════════════════════
   TABLET (≤ 1024px): 2 columnas
   ══════════════════════════════════════ */
@media (max-width: 1024px) {
  .cifras-contenedor {
    grid-template-columns: repeat(2, 1fr);
    gap: 28px;
    padding: 45px 16px 16px 16px;
  }
}

/* ══════════════════════════════════════
   MÓVIL (≤ 600px): 1 columna, tarjetas más
   angostas y más altas
   ══════════════════════════════════════ */
@media (max-width: 600px) {
  .cifras-contenedor {
    grid-template-columns: 1fr;
    gap: 22px;
    padding: 40px 16px 16px 16px;
    justify-items: center;
  }
  .cifras-tarjeta {
    width: 260px;
    max-width: 260px;
    margin-left: auto;
    margin-right: auto;
    justify-self: center;
  }
  .cifras-seccion .cifras-numero {
    font-size: 2rem;
  }
  .cifras-cuerpo {
    min-height: 230px;
  }
}
</style>
